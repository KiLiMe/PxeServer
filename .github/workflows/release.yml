name: release

# 只在推送 vX.Y.Z 形式的语义化版本标签时发版，例如：
#   pwsh ./Scripts/release.ps1 0.2.0        # 只打本地标签，先看一遍
#   pwsh ./Scripts/release.ps1 0.2.0 -Push  # 打标签并推送，Actions 开始构建发布
# 带 -alpha/-beta/-rc 的标签会自动标成预发布（prerelease）。其它任何情况都不触发本 workflow。
#
# 三个 job：meta 校验标签并解出版本号 → build 在 Windows / Linux 上各构建一份（矩阵）→
# publish 汇总所有资产创建 Release。构建与发布分开，两个平台才不会抢着往同一个 Release 里写。
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  meta:
    name: 校验标签
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: 校验标签格式
        id: tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $semver = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-(alpha|beta|rc)(\.\d+)?)?(\+[0-9A-Za-z.-]+)?$'
          if ($tag -notmatch $semver) {
            throw "标签应为 vX.Y.Z（可带 -alpha/-beta/-rc 或 +构建信息，例如 v0.1.0、v0.2.0-rc.1），实际：$tag"
          }
          # 版本号（去掉 v）注入两个平台：mygo 写进包元数据/文件属性，pxed 用 -X main.Version。
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $pre = if ($tag.Contains('-')) { 'true' } else { 'false' }
          "prerelease=$pre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本：$tag（预发布：$pre）"

  build:
    name: build (${{ matrix.platform }}/${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 静态检查在矩阵里只跑一遍：Linux 上最快，内容与 ci.yml 的 check job 一致。
      - name: gofmt / vet / test
        if: matrix.platform == 'linux'
        shell: pwsh
        run: |
          $out = @(gofmt -l .)
          if ($out.Count -gt 0) {
            Write-Host '::error::以下文件需要 gofmt：'
            $out | Write-Host
            exit 1
          }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet 失败' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'go test 失败' }

      # 打包期授权（build.ps1 会调 Scripts/patch-packages.sh）要用 dpkg-deb 与 rpm 工具：
      # ubuntu-latest 自带 dpkg-deb，rpm 得自己装（提供 rpm / rpm2cpio / rpmbuild）。
      - name: 安装打包工具（deb / rpm 注入）
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # build.ps1 两个平台共用：-Target linux -Package 出可执行文件 + deb / rpm / PKGBUILD / tar.gz。
      - name: 构建 PxeServer（GUI）
        shell: pwsh
        run: ./Scripts/build.ps1 -Target ${{ matrix.platform }} -Arch ${{ matrix.arch }} -Package -Version ${{ needs.meta.outputs.version }}

      - name: 构建 pxed（命令行）
        shell: pwsh
        run: |
          $exe = if ($env:RUNNER_OS -eq 'Windows') { 'pxed.exe' } else { 'pxed' }
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -ldflags "-s -w -X main.Version=${{ needs.meta.outputs.version }}" -o "build/$exe" ./cmd/pxed
          if ($LASTEXITCODE -ne 0) { throw 'pxed 构建失败' }

      - name: 冒烟：协议自检
        shell: pwsh
        run: |
          $exe = if ($env:RUNNER_OS -eq 'Windows') { 'build/pxed.exe' } else { './build/pxed' }
          & $exe -selftest
          if ($LASTEXITCODE -ne 0) { throw 'pxed -selftest 失败' }

      # 两个平台各打各的包：Windows 出一个含界面 + 命令行的 zip，Linux 直接发 mygo 的
      # deb / rpm / tar.gz / PKGBUILD，再把命令行版单独打一个 tar.gz（mygo 的包只含界面程序）。
      # 校验值统一在 publish 里对全部资产算一遍。
      - name: 打包
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $arch = '${{ matrix.arch }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          if ($env:RUNNER_OS -eq 'Windows') {
            $zip = "dist/PxeServer-$tag-windows-$arch.zip"
            Compress-Archive -Path build/PxeServer.exe, build/pxed.exe, README.md, LICENSE -DestinationPath $zip -Force
          } else {
            $dir = "build/linux-$arch"
            Copy-Item "$dir/*.deb", "$dir/*.rpm", "$dir/*-linux-$arch.tar.gz", "$dir/PKGBUILD" dist/
            # PKGBUILD 里的 install= 引用了这个文件（post_install 的来源），必须一起发。
            Get-ChildItem $dir -Filter '*.install' -ErrorAction SilentlyContinue | Copy-Item -Destination dist/
            $stage = "build/cli-linux-$arch"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item build/pxed, README.md, LICENSE $stage
            tar -czf "dist/PxeServer-$tag-linux-$arch-cli.tar.gz" -C $stage .
            if ($LASTEXITCODE -ne 0) { throw '打包命令行版失败' }
          }
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: 生成校验值
        shell: pwsh
        run: |
          $lines = foreach ($f in Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding utf8NoBOM
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize

      - name: 生成发布说明
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $gover = (go version) -replace '^go version go(\S+).*$', '$1'
          $sha = (git rev-parse --short HEAD).Trim()
          $repo = "$($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)"
          $log = (git log --oneline -20 --no-decorate | Out-String).Trim()
          # 单引号 here-string：里面的反引号与 $ 都是字面量，写 Markdown 不必转义；
          # 待填的位置用 @名字@ 占位，下面统一替换。
          $body = @'
          ## pxed · PXE 启动服务器 @TAG@

          Windows / amd64 与 Linux / amd64 构建，Go @GOVER@，提交 `@SHA@`。

          | 资产 | 平台 | 说明 |
          | --- | --- | --- |
          | `PxeServer-@TAG@-windows-amd64.zip` | Windows | 界面 `PxeServer.exe` + 命令行 `pxed.exe` |
          | `pxeserver_<版本>_amd64.deb` | Debian / Ubuntu | 桌面界面，依赖 `libgtk-3-0`、`libwebkit2gtk-4.1-0` |
          | `pxeserver-<版本>-1.x86_64.rpm` | Fedora / RHEL | 同上，依赖写在 rpm 元数据里 |
          | `PKGBUILD` | Arch | `makepkg -si` 直接装 |
          | `pxeserver-<版本>-linux-amd64.tar.gz` | Linux | 免安装包，解压后跑 `./install.sh` 装到 `~/.local` |
          | `PxeServer-@TAG@-linux-amd64-cli.tar.gz` | Linux | 命令行 `pxed` + README / LICENSE |
          | `SHA256SUMS.txt` | — | 以上全部资产的校验值 |

          首次运行会在当前目录生成 `config.json`。

          **Windows**：入站流量要在「设置 → 放行程序」里按程序路径放行。

          **Linux**：67 / 69（HTTP 默认 80）是特权端口，需要 `cap_net_bind_service`。
          deb / rpm / PKGBUILD 装完会自动授予这个能力，直接启动即可；免安装包则在界面点
          黄条上的「一键授权」（pkexec，会弹系统认证框），或手工执行
          `sudo setcap 'cap_net_bind_service=+ep' /opt/pxeserver/pxeserver`，赋权后重启程序。
          Linux 的防火墙按端口而不是按程序，界面不提供「放行程序」；
          开着 firewalld 的发行版（Fedora / RHEL / openSUSE）要自己开 `dhcp` 服务与 `69/udp`。

          > **压缩包里不含引导二进制。** `ipxe.efi` / `undionly.kpxe` / `wimboot` / `*.wim` / ISO 都要自备，
          > 下载地址见 [@REPO@/blob/@TAG@/docs/boot-files.md](@REPO@/blob/@TAG@/docs/boot-files.md)。

          ### 本次提交

          ```
          @LOG@
          ```
          '@
          $body = $body.Replace('@TAG@', $tag).Replace('@GOVER@', $gover).Replace('@SHA@', $sha).Replace('@REPO@', $repo).Replace('@LOG@', $log)
          Set-Content -Path dist/notes.md -Value $body -Encoding utf8NoBOM
          Get-Content dist/notes.md | Select-Object -First 3

      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne 'notes.md' } | ForEach-Object FullName)
          if ($null -eq (gh release view $tag --json tagName 2>$null)) {
            $ghArgs = @('release', 'create', $tag, '--title', $tag, '--notes-file', 'dist/notes.md', '--verify-tag')
            if ('${{ needs.meta.outputs.prerelease }}' -eq 'true') { $ghArgs += '--prerelease' }
            gh @ghArgs @assets
          } else {
            # 重跑同一次构建：不要报“release 已存在”，直接覆盖标题、说明与资产。
            gh release upload $tag @assets --clobber
            gh release edit $tag --title $tag --notes-file dist/notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw '创建 Release 失败' }
          gh release view $tag --json url --jq '.url'
