name: ci

# 分支 push / PR 跑轻量的 check：格式、vet、文案生成物、竞态测试（Linux 上最快）。
# 标签触发的双平台构建、打包与发布全在 release.yml，这里不重复。
on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt / test -race (internal, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # gofmt -l 不空即失败：格式不该靠 review 抓。
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::以下文件需要 gofmt："
            echo "$out"
            exit 1
          fi

      - name: go vet
        shell: bash
        run: go vet ./internal/...

      # 界面文案的访问器是生成物：catalog 改了没跑 generate 就会不一致。
      - name: 界面文案一致性
        shell: bash
        run: |
          go tool mygo generate
          if ! git diff --exit-code -- internal/locales/catalog_gen.go; then
            echo "::error::catalog_gen.go 与 internal/locales/*.json 不一致，请本地跑 go tool mygo generate 并提交"
            exit 1
          fi

      # DHCP / TFTP / HTTP 三个服务都是并发的，竞态检测值得跑。
      # 只跑 ./internal/...：根包是界面装配，逻辑都在 internal/，编一遍根包不值得。
      - name: go test -race
        shell: bash
        run: go test -race -count=1 ./internal/...
